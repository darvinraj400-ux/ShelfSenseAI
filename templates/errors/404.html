{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="card shadow-sm">
      <div class="card-body p-5">
        <h1 class="display-4 mb-3">404</h1>
        <h4 class="mb-3">Page Not Found</h4>
        <p class="text-muted mb-4">The page you're looking for doesn't exist or may have been moved.</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">{{ _t('NAV_DASHBOARD') }}</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
